name: CI

on:
  push:
    branches:
      - 'v3'
      - 'feature/*'
      - 'fix/*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build production bundles
        run: npm run build

      - name: Build instrumented test bundle
        run: |
          FLOW_COVERAGE=1 npm run build:test

      - name: Run browser suite with coverage
        run: node scripts/run-browser-tests.mjs --browser all --coverage

      - name: Coverage report
        run: node scripts/coverage-report.mjs

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
